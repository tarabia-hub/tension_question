<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tension Connection Solver</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Tension Connection Solver</h1>
      <p>
        Solves factored tensile resistance for a single-angle, single-line bolted tension connection using
        the same limit-state formulas shown in your assignment solution.
      </p>
    </header>

    <section class="card grid">
      <h2>Input Variables</h2>

      <label class="field"><span class="field-label">Gross area, A<sub>g</sub> (mm²)</span>
        <input id="Ag" type="number" value="1850" step="1" />
      </label>

      <label class="field"><span class="field-label">Thickness, t (mm)</span>
        <input id="t" type="number" value="9.5" step="0.1" />
      </label>

      <label class="field"><span class="field-label">Gauge, g (mm)</span>
        <input id="g" type="number" value="75" step="1" />
      </label>

      <label class="field"><span class="field-label">Bolt hole diameter, d<sub>h</sub> (mm)</span>
        <input id="dh" type="number" value="24" step="0.5" />
      </label>

      <label class="field"><span class="field-label">Bolt spacing, s (mm)</span>
        <input id="s" type="number" value="60" step="1" />
      </label>

      <label class="field"><span class="field-label">End distance, e (mm)</span>
        <input id="e" type="number" value="40" step="1" />
      </label>

      <details class="advanced-inputs">
        <summary>Show advanced inputs</summary>
        <div class="advanced-grid">
          <label class="field"><span class="field-label">Outstanding leg length, b (mm)</span>
            <input id="b" type="number" value="127" step="1" />
          </label>

          <label class="field"><span class="field-label">Number of bolts, n</span>
            <input id="n" type="number" value="4" step="1" />
          </label>

          <label class="field"><span class="field-label">Yield stress, F<sub>y</sub> (MPa)</span>
            <input id="Fy" type="number" value="350" step="1" />
          </label>

          <label class="field"><span class="field-label">Ultimate stress, F<sub>u</sub> (MPa)</span>
            <input id="Fu" type="number" value="450" step="1" />
          </label>

          <label class="field"><span class="field-label">Shear lag factor, U</span>
            <input id="U" type="number" value="0.8" step="0.01" />
          </label>

          <label class="field"><span class="field-label">Resistance factor (yielding), φ<sub>y</sub></span>
            <input id="phiY" type="number" value="0.9" step="0.01" />
          </label>

          <label class="field"><span class="field-label">Resistance factor (fracture), φ<sub>u</sub></span>
            <input id="phiU" type="number" value="0.75" step="0.01" />
          </label>

          <label class="field"><span class="field-label">Block-shear tension coefficient, u<sub>t</sub></span>
            <input id="ut" type="number" value="0.6" step="0.01" />
          </label>
        </div>
      </details>

      <button id="solveBtn">Solve</button>
      <p id="error" class="error"></p>
    </section>

    <section class="card">
      <h2>Results</h2>
      <div id="resultCards" class="result-grid"></div>
      <h3 id="governing" class="governing"></h3>

      <details class="calc-details">
        <summary>Show detailed calculations</summary>
        <pre id="steps" class="steps"></pre>
      </details>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
